name: Playwright Tests

# The suite runs against the public demo application
# (practicesoftwaretesting.com). No credentials: the setup-api project
# registers its own run user (plans/api-users.md), and the site removes all
# user data hourly, so nothing is left behind.
#
# CI runs the API tests only (--project=api): the demo site's UI sits behind
# Cloudflare bot protection, which challenges datacenter IPs like GitHub's
# runners. The full suite (UI included) runs green locally.
#
# Not a required branch check: the suite depends on a third-party demo API,
# and its downtime should not block merges (skill-lint and the template
# smoke test are the deterministic gates).
#
# Triggers: every push to main and every pull request; manually from the
# Actions tab ("Run workflow", any branch; only users with write access);
# and daily, so the badge shows whether the third-party API still behaves
# today, not just on the day of the last push. GitHub pauses scheduled runs
# after 60 days without repository activity.

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:
    schedule:
        # 06:17 UTC daily. Off the hour: less queueing on GitHub's side, and
        # clear of the site's hourly data wipe if that runs on the hour.
        - cron: '17 6 * * *'

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            APP_URL: https://practicesoftwaretesting.com
            API_URL: https://api.practicesoftwaretesting.com
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Write env file from workflow env
              run: |
                  mkdir -p env
                  {
                    echo "APP_URL=$APP_URL"
                    echo "API_URL=$API_URL"
                  } > env/.env.dev

            - name: Install Playwright browser
              run: npx playwright install --with-deps chromium

            - name: Run Playwright tests (API — see header comment)
              run: npx playwright test --project=api

            - uses: actions/upload-artifact@v7
              if: failure()
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 14
