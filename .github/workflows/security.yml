# Supply-chain and code security gates (OWASP Top 10 2025, A03 Software
# Supply Chain Failures):
#   npm-audit          known-vulnerable npm packages, high severity and above
#   dependency-review  a PR that adds a vulnerable dependency (PRs only)
#   secret-scan        committed credentials, over the full git history (gitleaks)
#   codeql             static analysis of the TypeScript; results in the
#                      Security tab (code scanning)
# Every action is pinned to a commit SHA with its version as a comment;
# Dependabot (.github/dependabot.yml) updates both. The token is read-only
# unless a job states otherwise.
name: Security

permissions:
    contents: read

on:
    push:
        branches: [main]
    pull_request:
    schedule:
        # Weekly, Monday 05:41 UTC: a new advisory against an unchanged lock
        # file turns this red without a push.
        - cron: '41 5 * * 1'

jobs:
    npm-audit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22

            # Reads package-lock.json only; no install, so no install scripts run.
            - name: npm audit (high and critical)
              run: npm audit --audit-level=high

    dependency-review:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
              with:
                  fail-on-severity: high

    secret-scan:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0 # scan every commit, not only the tip
                  persist-credentials: false

            - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
              env:
                  # Read-only: gitleaks uses it to list the commits of a PR.
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    codeql:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            security-events: write # upload results to code scanning
            actions: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
              with:
                  languages: javascript-typescript
                  build-mode: none
                  queries: security-extended

            - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
              with:
                  category: /language:javascript-typescript
